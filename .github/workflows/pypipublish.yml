name: Upload Python Package

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    paths:
      - ".github/workflows/pypipublish.yml"
      - "pyproject.toml"

jobs:
  dist:
    name: Build & inspect package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # converted datasets record the settings JSON schema of the version that
      # produced them, at https://raw.githubusercontent.com/.../refs/tags/v<version>/
      # (see healpix_convert/core/json_schema.py). Python normalises the version
      # read from the tag ("v2026.09.0" becomes 2026.9.0), so a tag that is not
      # exactly "v" + the version would make that URL point nowhere.
      - name: check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          python -m pip install --quiet setuptools-scm
          version="$(python -m setuptools_scm)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::release tag ${GITHUB_REF_NAME} should be v${version}"
            exit 1
          fi

      - uses: hynek/build-and-inspect-python-package@v2

  publish:
    name: Upload package to PyPI
    needs: [dist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Get dist files
        uses: actions/download-artifact@v8
        with:
          name: Packages
          path: dist

      - name: Generate artifact attestation for sdist and wheel
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "dist/*"

      - name: Publish on PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
